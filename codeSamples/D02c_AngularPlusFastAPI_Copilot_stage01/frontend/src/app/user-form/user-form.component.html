<h2>Enter your details</h2>
<form (ngSubmit)="submit()" #f="ngForm">
  <div class="form-row">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" [(ngModel)]="model.name">
  </div>
  <div class="form-row">
    <label for="address1">Address line 1</label>
    <input id="address1" name="address1" type="text" [(ngModel)]="model.address1">
  </div>
  <div class="form-row">
    <label for="address2">Address line 2</label>
    <input id="address2" name="address2" type="text" [(ngModel)]="model.address2">
  </div>
  <div class="form-row">
    <label for="postcode">Postcode</label>
    <input id="postcode" name="postcode" type="text" [(ngModel)]="model.postcode">
  </div>
  <div class="form-row">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="model.email">
  </div>
  <div class="form-row">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="text" [(ngModel)]="model.phone">
  </div>
  <div class="actions">
    <button class="btn" type="submit">Submit</button>
  </div>
  <div style="margin-top:10px;color:green">{{message}}</div>
</form>
